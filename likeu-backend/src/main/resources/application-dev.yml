server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: likeu-word

  # ============== H2 内存数据库（开发环境） ==============
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:likeu_word;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # 初始化脚本（Spring Boot 2.5+ 使用 spring.sql.init.*）
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql

  # ============== H2 Web Console（开发调试用） ==============
  h2:
    console:
      enabled: true
      path: /h2-console

  # ============== 禁用 Redis（开发环境用内存模拟） ==============
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 0
        max-idle: 0
        min-idle: 0
        max-wait: -1ms

  # ============== 文件上传 ==============
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============== MyBatis-Plus ==============
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.likeu.word.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============== 微信小程序配置（开发环境随便填） ==============
wx:
  mini:
    appid: wx-test-appid
    secret: test-secret

# ============== JWT 配置 ==============
jwt:
  secret: your-jwt-secret-key-change-me
  expire-seconds: 604800
  redis-prefix: "likeu:token:"

# ============== 日志 ==============
logging:
  level:
    com.likeu.word: debug
    org.springframework: info