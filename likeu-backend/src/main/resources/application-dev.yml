server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: likeu-word

  # ============== H2 内存数据库（开发环境） ==============
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:likeu_word;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # 初始化脚本（Spring Boot 2.5+ 使用 spring.sql.init.*）
  # dev 用 H2 内存库，每次启动都是空库，必须显式打开初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql

  # ============== H2 Web Console（开发调试用） ==============
  h2:
    console:
      enabled: true
      path: /h2-console

  # ============== 禁用 Redis（开发环境用内存模拟） ==============
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 0
        max-idle: 0
        min-idle: 0
        max-wait: -1ms

  # ============== 文件上传 ==============
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============== MyBatis-Plus ==============
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.likeu.word.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============== 微信小程序配置（开发环境模拟登录，不调用微信接口） ==============
wx:
  mini:
    appid: wx-test-appid
    secret: test-secret

# ============== JWT 配置 ==============
# dev 提供一个非示例值的默认密钥，保证免配置即可启动；其他环境必须通过 JWT_SECRET 注入
jwt:
  secret: ${JWT_SECRET:likeu-dev-jwt-secret-not-for-production}
  expire-seconds: 604800
  redis-prefix: "likeu:token:"

# ============== 业务配置 ==============
likeu:
  auth:
    # H2 控制台只在 dev 开启，因此仅 dev 把它与接口文档一起加入免登录白名单
    white-list: /h2-console,/v3/api-docs,/swagger-ui
  cache:
    root-ttl-minutes: 60

# ============== 接口文档 ==============
# 仅 dev 打开，便于本地联调时直接看接口
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ============== 健康检查 ==============
# dev 的 Redis 是内存模拟实现，未实现 INFO 命令（默认方法会自递归导致栈溢出），故关闭该指标
management:
  health:
    redis:
      enabled: false

# ============== 日志 ==============
logging:
  level:
    com.likeu.word: debug
    org.springframework: info