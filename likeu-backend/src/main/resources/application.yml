server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: likeu-word

  # ============== MySQL ==============
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/likeu_word?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your-db-password

  # ============== Redis ==============
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 0
        max-wait: 3000ms

  # ============== 文件上传（批量导入用） ==============
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============== MyBatis-Plus ==============
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.likeu.word.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============== 微信小程序配置 ==============
wx:
  mini:
    appid: your-appid-here
    secret: your-secret-here

# ============== JWT 配置 ==============
jwt:
  secret: your-jwt-secret-key-change-me
  expire-seconds: 604800
  redis-prefix: "likeu:token:"

# ============== 日志 ==============
logging:
  level:
    com.likeu.word: debug
    org.springframework: info