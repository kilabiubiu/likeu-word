server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: likeu-word

  # ============== MySQL ==============
  # 连接信息支持环境变量覆盖，真实密码请放到 application-local.yml（已在 .gitignore 中）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:likeu_word}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your-db-password}
    hikari:
      pool-name: LikeuHikariPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ============== Redis ==============
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: ${REDIS_POOL_MIN_IDLE:2}
        max-wait: 3000ms

  # ============== 首次启动建表 / 演示数据 ==============
  # 默认关闭：生产环境重启不应自动建表或重复灌入演示数据，需要初始化时显式设置 DB_INIT_MODE=always
  # dev / local 两个 profile 已在各自的 application-*.yml 中显式打开
  # schema.sql 使用 CREATE TABLE IF NOT EXISTS，演示数据使用 INSERT IGNORE + 先删后插，均可重复执行
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/init_demo_data.sql

  # ============== 文件上传（批量导入用） ==============
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============== MyBatis-Plus ==============
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.likeu.word.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # 默认关闭 SQL 打印：StdOutImpl 会把 SQL 与参数直接写到 stdout，噪音大且有数据泄露风险
    # dev profile 单独打开，其他环境需要排查 SQL 时改 com.likeu.word.mapper 的日志级别
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============== 微信小程序配置 ==============
# 真实凭据通过环境变量注入，启动时由 StartupConfigValidator 校验非空且非示例值
wx:
  mini:
    appid: ${WX_MINI_APPID:}
    secret: ${WX_MINI_SECRET:}

# ============== JWT 配置 ==============
jwt:
  secret: ${JWT_SECRET:}
  expire-seconds: 604800
  redis-prefix: "likeu:token:"

# ============== 业务配置 ==============
likeu:
  cache:
    # 词根同源单词缓存时长（分钟）
    root-ttl-minutes: 60
    # 单词详情缓存时长（分钟）
    word-ttl-minutes: 120
    # 词书列表缓存时长（分钟）：词书几乎不变，用长 TTL
    wordbook-ttl-minutes: 1440
  cors:
    # 允许跨域的来源白名单，多个用逗号分隔；留空表示不启用跨域（小程序请求不受同源策略约束）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # 额外的免登录路径，多个用逗号分隔；仅开发调试用，生产保持为空
    white-list: ${AUTH_WHITE_LIST:}

# ============== 日志 ==============
logging:
  level:
    com.likeu.word: info
    org.springframework: info