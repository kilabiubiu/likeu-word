server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: likeu-word

  # ============== MySQL ==============
  # 连接信息支持环境变量覆盖，真实密码请放到 application-local.yml（已在 .gitignore 中）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:likeu_word}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your-db-password}
    hikari:
      pool-name: LikeuHikariPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ============== Redis ==============
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: ${REDIS_POOL_MIN_IDLE:2}
        max-wait: 3000ms

  # ============== 首次启动建表 / 演示数据 ==============
  # schema.sql 使用 CREATE TABLE IF NOT EXISTS，演示数据使用 INSERT IGNORE + 先删后插，均可重复执行
  # 数据库已自行维护时可设置环境变量 DB_INIT_MODE=never 关闭自动初始化
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/init_demo_data.sql

  # ============== 文件上传（批量导入用） ==============
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============== MyBatis-Plus ==============
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.likeu.word.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============== 微信小程序配置 ==============
wx:
  mini:
    appid: your-appid-here
    secret: your-secret-here

# ============== JWT 配置 ==============
jwt:
  secret: your-jwt-secret-key-change-me
  expire-seconds: 604800
  redis-prefix: "likeu:token:"

# ============== 业务配置 ==============
likeu:
  cache:
    # 词根基础数据缓存时长（分钟）
    root-ttl-minutes: 60

# ============== 日志 ==============
logging:
  level:
    com.likeu.word: debug
    org.springframework: info